version: '3.8'

services:
  api:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_URL=postgresql://postgres:postgres@db:5432/resume_ai_db
      # If using Google Cloud Service Account, ensure the file is in the root as 'service-account.json'
      # and GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json in .env
    volumes:
      - ./uploads:/app/uploads
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resume_ai_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
