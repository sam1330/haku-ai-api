services:
  api:
    container_name: haku-ai-api
    build: .
    command: >
      sh -c "npx knex migrate:latest --knexfile ./knexfile.js && 
             npm run start"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_URL=${DB_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - haku-network

  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=haku_api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - haku-network

networks:
  haku-network:
    driver: bridge
    external: true

volumes:
  postgres_data:
